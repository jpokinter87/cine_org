<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fond ambre vif pour visibilité dans les onglets sombres -->
  <rect width="32" height="32" rx="7" fill="#e8a849"/>
  <!-- Bobine de film — formes épaisses, lisibles à 16px -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#0a0a0f" stroke-width="3"/>
  <circle cx="16" cy="16" r="4" fill="#0a0a0f"/>
  <!-- 3 rayons épais (120°) -->
  <line x1="16" y1="5" x2="16" y2="12" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6.47" y1="21.5" x2="12.54" y2="18" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25.53" y1="21.5" x2="19.46" y2="18" stroke="#0a0a0f" stroke-width="2.5" stroke-linecap="round"/>
</svg>
